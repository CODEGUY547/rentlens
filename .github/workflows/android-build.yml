name: Build RentLens Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Android compiler output"
              echo '```text'
              tail -n 160 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            output=$(tail -n 120 build.log)
            output=${output//'%'/'%25'}
            output=${output//$'\r'/'%0D'}
            output=${output//$'\n'/'%0A'}
            echo "::error title=Android compiler output::$output"
            exit "$status"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentLens-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
